name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore

      - run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./test-results/coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Coverage gate (line >= 85%)
        run: python3 scripts/coverage-gate.py ./test-results/coverage --threshold 85 --verbose

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Compose config gate (sintaxe + tags existem no registry)
        env:
          HUB_APP_PASSWORD: dummy
        run: |
          set -e
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

          images=$(docker compose -f docker-compose.yml config --format json \
            | jq -r '.services[] | select(.build == null) | .image' | sort -u)

          failed=0
          for image in $images; do
            if output=$(docker manifest inspect "$image" 2>&1); then
              echo "OK    $image"
            elif echo "$output" | grep -qiE 'no such manifest|manifest unknown|not found'; then
              echo "FALHA $image (tag inexistente no registry)"
              echo "$output"
              failed=1
            else
              echo "AVISO $image: falha ao consultar o manifest (ignorado)"
              echo "$output"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Gate reprovado: pelo menos uma tag pinada não existe no registry."
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: HUB_APP_PASSWORD
          script: |
            set -e
            REPO_DIR=/opt/hub-precos
            mkdir -p "$REPO_DIR"
            cd "$REPO_DIR"

            echo "== preflight =="
            docker network inspect tesouro-net >/dev/null 2>&1 || {
              echo "ERRO: rede docker 'tesouro-net' não existe. O compose do tesouro-direto a cria;"
              echo "sem ela o Hub subiria numa rede isolada e não enxergaria o Postgres."
              docker network ls
              exit 1
            }
            docker ps --format '{{.Names}}' | grep -qx tesouro-direto-db || {
              echo "ERRO: container 'tesouro-direto-db' não está rodando — é o Postgres compartilhado (§12 do plano)."
              docker ps --format '  {{.Names}}'
              exit 1
            }
            echo "preflight ok"

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            git fetch origin main
            git reset --hard origin/main

            HUB_APP_PASSWORD="$(printf '%s' "$HUB_APP_PASSWORD" | tr -d '\r\n')"
            if [ -z "$HUB_APP_PASSWORD" ]; then
              echo "ERRO: secret HUB_APP_PASSWORD vazio (ou só com quebras de linha)."
              exit 1
            fi

            printf 'HUB_APP_PASSWORD=%s\n' "$HUB_APP_PASSWORD" > .env
            chmod 600 .env

            echo "== provisionamento do banco =="
            ./infra/postgres/provision-remote.sh

            echo "== guarda de colisão de alias na tesouro-net =="
            outros=$(docker ps --format '{{.Names}}' | grep -vx hub-precos-app || true)
            alheios=$(for c in $outros; do
              docker inspect -f '{{range $n,$v := .NetworkSettings.Networks}}{{if eq $n "tesouro-net"}}{{range $v.Aliases}}{{.}}{{"\n"}}{{end}}{{end}}{{end}}' "$c" 2>/dev/null
            done | sort -u | grep -v '^$' || true)
            for s in $(HUB_APP_PASSWORD=dummy docker compose -f docker-compose.prod.yml config --services); do
              if echo "$alheios" | grep -qx "$s"; then
                echo "ERRO: o serviço '$s' colide com um alias DNS já registrado na rede tesouro-net"
                echo "      por outro container. Subir assim faria o DNS do Docker alternar entre os"
                echo "      dois, quebrando METADE das chamadas de ambos os lados, sem erro visível."
                echo "      Renomeie o serviço em docker-compose.prod.yml para algo único na rede."
                echo "      Aliases já registrados por terceiros:"
                echo "$alheios" | sed 's/^/        /'
                exit 1
              fi
            done
            echo "sem colisão"

            echo "== build e up =="
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "== esperando ficar healthy =="
            timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hub-precos-app 2>/dev/null)" = "healthy" ]; do
              sleep 5
            done' || {
              echo "ERRO: container não ficou healthy. Últimas linhas do log:"
              docker logs --tail 50 hub-precos-app || true
              exit 1
            }

            echo "== deploy concluído =="
            docker image prune -f
        env:
          HUB_APP_PASSWORD: ${{ secrets.HUB_APP_PASSWORD }}
