# Limites de memoria/disco do broker `plataforma-rabbitmq` EM PRODUCAO. Ver o
# comentario do servico no docker-compose.prod.yml para o raciocinio completo
# (watermark relativo estouraria o limite de memória do container numa VPS de 2GB).
#
# Nao da para usar a env var RABBITMQ_VM_MEMORY_HIGH_WATERMARK para isso: a
# imagem rabbitmq:4 marcou essa env var como DEPRECATED e o entrypoint recusa
# subir o container se ela estiver setada ("error: deprecated environment
# variables detected") - confirmado rodando a imagem localmente. Por isso o
# valor entra por arquivo de config, montado como read-only neste caminho.
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 512MB
