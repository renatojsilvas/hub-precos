# Limites de memoria/disco do broker `plataforma-rabbitmq` EM PRODUCAO. Ver o
# comentario do servico no docker-compose.prod.yml para o raciocinio completo
# (watermark relativo estouraria o limite de memória do container numa VPS de 2GB).
#
# Nao da para usar a env var RABBITMQ_VM_MEMORY_HIGH_WATERMARK para isso: a
# imagem rabbitmq:4 marcou essa env var como DEPRECATED e o entrypoint recusa
# subir o container se ela estiver setada ("error: deprecated environment
# variables detected") - confirmado rodando a imagem localmente. Por isso o
# valor entra por arquivo de config, montado como read-only neste caminho.
vm_memory_high_watermark.absolute = 160MiB
disk_free_limit.absolute = 512MB

# Coleta de estatisticas do plugin de management. O default e 5000ms, e numa VPS
# de UM nucleo essa coleta e uma rajada que quer mais que a cota de CPU do
# container: medido em producao em 2026-09-05, os picos batiam em 59,99% com o
# teto em 0.60 (ou seja, cortados exatamente no teto), a cada ~5s, enquanto o
# broker ficava 99,8% ocioso entre eles. Isso mantinha o alerta
# td-container-cpu-throttling (>20% dos periodos, 10m) indo e voltando.
#
# 60s em vez de 5s reduz a frequencia da rajada em 12x. O management aqui e
# usado sob demanda, por tunel SSH, para depurar - ninguem observa taxa de
# mensagem em tempo real neste broker, que movimenta ~1 mensagem por dia.
collect_statistics_interval = 60000
