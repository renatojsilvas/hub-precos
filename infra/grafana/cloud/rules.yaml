apiVersion: 1
groups:
  - orgId: 1
    name: hub-alertas
    folder: HubPrecos
    interval: 1m
    rules:
      - uid: hub-ingestao-falha
        title: Hub — Falha de ingestão
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: increase(hub_ingestao_ciclos_total{job="hub-precos",outcome="failure"}[1h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Mais de 3 ciclos de ingestão TD falharam na última hora
          description: O Hub roda o ciclo de ingestão a cada 15min (96x/dia); 3 falhas em 1h é metade dos ciclos da hora. Verifique os logs do TdIngestaoJob ("Ingestao TD API falhou") para o Error.Code/Description e o status do upstream do TD antes de escalar.
        labels:
          severity: warning
          service: hub-precos
        isPaused: false
      - uid: hub-ingestao-frescor
        title: Hub — Dado parado (frescor da ingestão)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: time() - max(hub_ingestao_ultimo_sucesso_timestamp_seconds{job="hub-precos"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3600
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: Alerting
        execErrState: Alerting
        for: 30m
        annotations:
          summary: Sem ciclo de ingestão TD bem-sucedido há mais de 1h
          description: >-
            O Hub roda 24/7, sem janela de dia útil, então não há guarda de day_of_week
            aqui. noDataState=Alerting de propósito — se o app reiniciar e nunca mais
            tiver sucesso, o gauge some e a ausência de dado precisa soar, não calar.
            O for de 30 minutos (não 15) é a margem sobre a cadência de quem alimenta a
            métrica, não igual a ela — o cron é 0 0/15 * * * ? com
            WithMisfireHandlingInstructionDoNothing(), então um restart que atravesse um
            tick agendado pula aquele tick e só dispara no próximo, um gap real de ~30min
            em deploy saudável; somado a noDataState=Alerting (o gauge some no restart),
            um for de 15 minutos gritaria lobo a cada deploy. 30 minutos cobrem um tick
            perdido mais um misfire. Compare com td-metricas-container-obsoletas do repo
            de referência, que usa for de 5 minutos para uma métrica alimentada a cada
            ~1min — 5x de folga sobre a cadência; aqui a cadência é 15min, então a folga
            proporcional pede dezenas de minutos, não 15. Não aperte este valor de volta
            para 15 minutos achando frouxo — verifique se o container hub-precos está de
            pé (up job hub-precos), se o job está agendado no Quartz e os logs do último
            ciclo. Este é o defeito de produção (ingestão falhando por dias, tabelas em 0
            linhas, sem alerta) que motivou esta regra.
        labels:
          severity: critical
          service: hub-precos
        isPaused: false
      - uid: hub-sem-metrica
        title: Hub — Serviço sumiu do scrape
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: absent(up{job="hub-precos"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Nenhuma série com job="hub-precos" chegando ao Grafana Cloud
          description: >-
            Esta regra vigia a própria observabilidade — é a única que dispara quando o
            problema é NÃO haver dado. Todas as outras regras deste grupo dependem de
            métricas do Hub existirem; se a série some, elas não disparam, ficam mudas, e
            a ausência de alerta é lida como "está tudo bem". Foi assim que o Hub passou
            semanas sem alerta nenhum na nuvem sem ninguém notar.
            `absent()` de propósito, e não `up == 0`: `up == 0` só existe se o alvo ainda
            estiver configurado e falhando; se alguém remove o alvo do scrape, renomeia o
            container ou troca o `job=`, a série simplesmente deixa de existir e `up == 0`
            nunca é verdade. `absent()` cobre os dois casos.
            noDataState=OK, ao contrário das outras: `absent()` JÁ É o sinal, e devolve 1
            quando não há dado. Marcar no-data como Alerting aqui faria a regra disparar
            também quando o próprio datasource estivesse inacessível, misturando "o Hub
            sumiu" com "o Grafana não respondeu" — dois problemas com donos diferentes.
            10 minutos de `for` porque o scrape é de 30s: uma janela curta transformaria
            deploy (que reinicia o container) em alerta. Se disparar, a ordem de
            investigação é: o container está de pé na VPS? o alvo `hub-precos-app:8080`
            ainda existe em `infra/alloy/config.alloy` no repo do tesouro-direto? o
            `container_name` mudou? Ver PADROES.md §10.1 — nome de serviço no compose vira
            alias DNS, e renomear quebra o scrape em silêncio.
        labels:
          severity: critical
          service: hub-precos
        isPaused: false
      - uid: hub-outbox-backlog-velho
        title: Hub — Backlog da outbox envelhecido
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: max(hub_outbox_pendente_mais_antiga_segundos{job="hub-precos"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 900
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Mensagem mais antiga da outbox pendente há mais de 15 minutos
          description: >-
            Idade (hub_outbox_pendente_mais_antiga_segundos), não contagem
            (hub_outbox_pendentes) de propósito — backlog transitório é normal (o relay
            drena a cada 5s, Outbox:Relay:IntervaloSegundos), backlog VELHO é o sintoma
            real. 15 minutos (900s) é folga generosa sobre a cadência de 5s do relay: uma
            mensagem só fica velha se algo está impedindo o dreno, não por variação normal
            de carga. noDataState=Alerting de propósito, igual à regra Hub — Dado parado:
            esta métrica só é gravada em RelayOutboxJob quando o ciclo termina com sucesso
            (RelayResultado.PendentesRestantes não nulo); ausência prolongada dela
            significa que o relay nunca conseguiu ler o backlog desde o boot — app fora do
            ar ou Postgres inacessível — e isso precisa soar, não calar. Se este alerta
            disparar com hub-relay-falha-persistente também firing, o problema é o broker
            RabbitMQ ou o Postgres; se disparar sozinho, o relay está lendo mas não
            drenando na velocidade necessária (lote/MaxLotesPorCiclo pequeno demais para o
            volume, ou publish lento). Verifique os logs do RelayOutboxJob e o painel
            "Ciclos de relay por desfecho".
        labels:
          severity: critical
          service: hub-precos
        isPaused: false
      - uid: hub-relay-falha-persistente
        title: Hub — Relay outbox falhando persistentemente
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: increase(hub_relay_ciclos_total{job="hub-precos",outcome="failure"}[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 30
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Mais de 30 ciclos de relay da outbox falharam nos últimos 5 minutos
          description: >-
            O relay roda a cada 5s (Outbox:Relay:IntervaloSegundos), até 60 ciclos
            possíveis em 5m; 30 é metade, mesmo raciocínio proporcional de
            hub-ingestao-falha. Esta regra existe porque o alerta de idade do backlog
            (hub-outbox-backlog-velho) NÃO pega todo cenário: quando o próprio ciclo falha
            (ex.: RabbitMQ fora do ar, retornando OutboxErrors.BrokerIndisponivel, ou
            Postgres inacessível ao ler pendentes), RelayOutboxJob só chama
            RecordCicloRelay("failure") — RecordOutboxBacklog nunca é chamado nesse
            caminho, então o gauge de idade CONGELA no último valor bom em vez de crescer,
            e pode ficar abaixo do threshold de idade por um bom tempo. noDataState=OK
            porque RecordCicloRelay é chamado incondicionalmente a cada execução (sucesso
            OU falha) enquanto o processo estiver de pé; ausência de dado aqui é "app não
            está rodando", coberto por outro sinal (up), não por esta regra.
        labels:
          severity: critical
          service: hub-precos
        isPaused: false
